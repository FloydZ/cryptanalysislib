name: osx

on: [push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is arm64 (Apple Silicon)
        os: [macos-15]
        build_type: [Release, Debug]

    name: Build & test on ${{ matrix.os }} with brew llvm in ${{ matrix.build_type }} mode.
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install Software (HomeBrew)
      run: brew install libomp llvm googletest google-benchmark

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DCMAKE_CXX_COMPILER=$(brew --prefix llvm)/bin/clang++

    - name: Build
      run: cmake --build ${{github.workspace}}/build --parallel $(sysctl -n hw.ncpu)

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure --timeout 600 -E "bench_"
