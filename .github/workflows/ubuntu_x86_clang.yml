name: ubuntu_x86_clang

on: [push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # the library needs C++23: ubuntu 22.04 (clang <= 15) is too old
        os: [ubuntu-24.04]
        version: [ 18 ]
        build_type: [Release, Debug]

    name: Build & test on ${{ matrix.os }} with clang-${{ matrix.version }} in ${{ matrix.build_type }} mode.
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install Software
      run: |
        sudo apt-get update
        sudo apt-get install -y libtbb-dev clang-${{matrix.version}} libomp-${{matrix.version}}-dev libgtest-dev libbenchmark-dev

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DCMAKE_CXX_COMPILER=clang++-${{matrix.version}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --parallel $(nproc)

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure --timeout 600 -E "bench_"
