[project]
name = "cryptanalysislib"
version = "0.1.0"
description = "breaking all the crypto"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security :: Cryptography",
]

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools]
packages = ["cryptanalysislib", "tests"]

[tool.setuptools.package-data]

[tool.pytest.ini_options]
testpaths = [ "tests", "cryptanalysislib"]
markers = [
    "integration: compiles and runs the C++ library (needs submodules, cmake and a C++23 compiler)",
]
